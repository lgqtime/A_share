<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>深市主板实时监控</title>
    <style>
        :root {
            color-scheme: light;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #f5f7fa;
            color: #1f2937;
        }

        body { margin: 0 auto; max-width: 1200px; padding: 20px; }
        h1 { margin: 0 0 16px; font-size: 24px; }
        .status { background: #fff; border: 1px solid #d9dee7; border-radius: 6px; margin-bottom: 16px; padding: 10px 12px; }
        .error { color: #b42318; }
        table { background: #fff; border-collapse: collapse; width: 100%; }
        th, td { border-bottom: 1px solid #e1e5eb; padding: 10px 12px; text-align: left; }
        th { background: #eef1f5; font-weight: 600; }
        .quote-row:hover, .chart-row:hover { background: #f8fafc; }
        .positive { color: #d92d20; }
        .negative { color: #039855; }
        .stale { color: #b54708; font-size: 12px; margin-left: 6px; }
        .chart-row td { background: #fbfcfe; padding: 0 12px 14px; }
        .chart-heading { color: #475467; font-size: 13px; margin: 10px 0 6px; }
        .stock-chart { background: #fff; border: 1px solid #e4e8ef; border-radius: 4px; display: block; height: 210px; width: 100%; }

        @media (max-width: 640px) {
            body { padding: 12px; }
            th, td { padding: 8px; white-space: nowrap; }
            table { display: block; overflow-x: auto; }
            .stock-chart { height: 180px; min-width: 560px; }
        }
    </style>
</head>
<body>
    <h1>深市主板实时监控（前 20 只候选）</h1>
    <div class="status" id="status">正在加载数据...</div>

    <table id="stockTable">
        <thead>
            <tr>
                <th>排名</th>
                <th>股票名称</th>
                <th>最新价</th>
                <th>昨收</th>
                <th>涨跌幅（%）</th>
                <th>更新时间</th>
            </tr>
        </thead>
        <tbody id="stockData">
            <tr><td colspan="6" style="text-align: center;">等待数据...</td></tr>
        </tbody>
    </table>

    <script>
        const state = { quotes: [], history: {} };
        const chartColor = '#2563eb';

        function formatTime(value) {
            return value ? new Date(value.replace(' ', 'T')).toLocaleTimeString('zh-CN') : '未知';
        }

        function drawStockChart(canvas, points) {
            const context = canvas.getContext('2d');
            const bounds = canvas.getBoundingClientRect();
            const ratio = window.devicePixelRatio || 1;
            const width = Math.max(bounds.width, 500);
            const height = Math.max(bounds.height, 170);
            canvas.width = Math.floor(width * ratio);
            canvas.height = Math.floor(height * ratio);
            context.setTransform(ratio, 0, 0, ratio, 0, 0);
            context.clearRect(0, 0, width, height);

            const margin = { top: 14, right: 20, bottom: 28, left: 52 };
            const plotWidth = width - margin.left - margin.right;
            const plotHeight = height - margin.top - margin.bottom;
            context.font = '12px sans-serif';
            context.lineWidth = 1;

            if (!points.length) {
                context.fillStyle = '#667085';
                context.textAlign = 'center';
                context.fillText('等待第一条行情记录', width / 2, height / 2);
                return;
            }

            const values = points.map(point => Number(point.change_pct));
            const minimum = Math.min(...values, 0);
            const maximum = Math.max(...values, 0);
            const padding = Math.max((maximum - minimum) * 0.12, 0.5);
            const minValue = minimum - padding;
            const maxValue = maximum + padding;
            const valueRange = maxValue - minValue || 1;
            const x = index => margin.left + (points.length === 1 ? plotWidth / 2 : index * plotWidth / (points.length - 1));
            const y = value => margin.top + (maxValue - value) * plotHeight / valueRange;

            context.strokeStyle = '#e4e7ec';
            context.fillStyle = '#667085';
            context.textAlign = 'right';
            for (let row = 0; row <= 4; row += 1) {
                const value = maxValue - valueRange * row / 4;
                const yPosition = y(value);
                context.beginPath();
                context.moveTo(margin.left, yPosition);
                context.lineTo(width - margin.right, yPosition);
                context.stroke();
                context.fillText(`${value.toFixed(2)}%`, margin.left - 8, yPosition + 4);
            }

            context.strokeStyle = '#98a2b3';
            context.beginPath();
            context.moveTo(margin.left, y(0));
            context.lineTo(width - margin.right, y(0));
            context.stroke();

            context.strokeStyle = chartColor;
            context.fillStyle = chartColor;
            context.lineWidth = 1.5;
            context.beginPath();
            points.forEach((point, index) => {
                const pointX = x(index);
                const pointY = y(Number(point.change_pct));
                if (index === 0) context.moveTo(pointX, pointY);
                else context.lineTo(pointX, pointY);
            });
            context.stroke();
            points.forEach((point, index) => {
                context.beginPath();
                context.arc(x(index), y(Number(point.change_pct)), 3.5, 0, Math.PI * 2);
                context.fill();
            });

            context.fillStyle = '#667085';
            context.textAlign = 'left';
            context.fillText(formatTime(points[0].timestamp), margin.left, height - 8);
            context.textAlign = 'right';
            context.fillText(formatTime(points[points.length - 1].timestamp), width - margin.right, height - 8);
        }

        function renderStocks() {
            const tbody = document.getElementById('stockData');
            tbody.replaceChildren();
            state.quotes.forEach((stock, index) => {
                const changeClass = stock.change_pct > 0 ? 'positive' : (stock.change_pct < 0 ? 'negative' : '');
                const changeSign = stock.change_pct > 0 ? '+' : '';
                const staleNote = stock.stale ? '<span class="stale">沿用上一数据点</span>' : '';
                const quoteRow = document.createElement('tr');
                quoteRow.className = 'quote-row';
                quoteRow.innerHTML = `
                    <td>${index + 1}</td>
                    <td>${stock.name}${staleNote}</td>
                    <td>${stock.last_price.toFixed(2)}</td>
                    <td>${stock.prev_close.toFixed(2)}</td>
                    <td class="${changeClass}">${changeSign}${stock.change_pct.toFixed(2)}%</td>
                    <td>${formatTime(stock.updated_at)}</td>`;
                tbody.appendChild(quoteRow);

                const chartRow = document.createElement('tr');
                chartRow.className = 'chart-row';
                const chartCell = document.createElement('td');
                chartCell.colSpan = 6;
                const heading = document.createElement('div');
                heading.className = 'chart-heading';
                heading.textContent = `${stock.name} 涨跌幅实时点图`;
                const canvas = document.createElement('canvas');
                canvas.className = 'stock-chart';
                canvas.setAttribute('aria-label', `${stock.name} 涨跌幅实时点图`);
                chartCell.append(heading, canvas);
                chartRow.appendChild(chartCell);
                tbody.appendChild(chartRow);
                requestAnimationFrame(() => drawStockChart(canvas, state.history[stock.code] || []));
            });

            if (!state.quotes.length) {
                tbody.innerHTML = '<tr><td colspan="6" style="text-align: center;">暂无有效行情</td></tr>';
            }
        }

        async function fetchQuotes() {
            try {
                const response = await fetch('/api/quotes', { cache: 'no-store' });
                const data = await response.json();
                state.quotes = data.quotes || [];
                state.history = data.history || {};
                renderStocks();
                const updateTime = data.last_update ? new Date(data.last_update).toLocaleString('zh-CN') : '未知';
                const warning = data.error ? `（${data.error}）` : '';
                document.getElementById('status').textContent = `最后更新：${updateTime}${warning}`;
            } catch (error) {
                document.getElementById('status').innerHTML = `<span class="error">获取数据失败: ${error.message}</span>`;
            }
        }

        window.addEventListener('resize', renderStocks);
        fetchQuotes();
        setInterval(fetchQuotes, 10000);
    </script>
</body>
</html>
